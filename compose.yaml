networks:
  spylogic-net:

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: ['ollama']
    logging:
      driver: journald
    networks:
      - spylogic-net
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    devices:
      - nvidia.com/gpu=all

  # Pulls models into Ollama on startup.
  # Edit the command below to change which models are pulled.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    profiles: ['ollama']
    logging:
      driver: journald
    networks:
      - spylogic-net
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command:
      - "ollama pull qwen2.5:3b && ollama pull nomic-embed-text && echo 'All models pulled.'"

  spylogic:
    logging:
      driver: journald
    networks:
      - spylogic-net
    environment:
      COOKIE_NAME: SpyLogicLite.sid
      SESSION_EXPIRY_HOURS: 2
      PORT: 5000
    build:
      context: .
      dockerfile: prodlite.Dockerfile
    image: docker.io/scottlogic/spylogic-playground
    ports:
      - '5000:5000'
    volumes:
      - ./backend/.env:/usr/app/backend/.env:ro

volumes:
  ollama_data:
